<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<title>Whiteboard App</title>
</head>

	<body 
	style="
	margin:0;
	width: 100vw;
	height: 100vh;
	overflow: hidden;
	">

		<div id="frame" 
		style="
		padding: min(10px,2%);
		width: 100%;
      	height: 100%;
		border-radius: 1%;
		box-sizing: border-box;
		-webkit-app-region: drag;
		background-color: #1d1d20;
		">
		<canvas 
		id="board" 
		style="
			display: block;
			height: 100%;
			width: 100%;
			border-radius: 1%;
			background-color:#2b2b30; 
			-webkit-app-region:no-drag;
			cursor: url('../resources/pen.png') 0 24, crosshair;
			box-sizing: border-box;

		"
		></canvas>

		<script src="index.js"></script>
		
		</div>

		
	</body>



</html>
